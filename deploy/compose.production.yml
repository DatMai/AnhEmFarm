name: anhemfarm
services:
  db:
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_USER: anhemfarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: anhemfarm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U anhemfarm -d anhemfarm']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env.production
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: /tmp
    restart: unless-stopped
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["node", "dist/src/worker.js"]
    env_file: ../.env.production
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: /tmp
    restart: unless-stopped
  migrate:
    profiles: [migration]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["npm", "run", "db:migrate"]
    env_file: ../.env.production
    depends_on:
      db:
        condition: service_healthy
  proxy:
    image: caddy:2.10-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
