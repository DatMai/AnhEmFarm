name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: anhemfarm
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: anhemfarm_commerce_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U anhemfarm -d anhemfarm_commerce_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
        ports: ['1025:1025', '8025:8025']
    env:
      APP_MODE: test
      APP_ORIGIN: http://127.0.0.1:4278
      DATABASE_URL: postgresql://anhemfarm:ci-only-password@127.0.0.1:5432/anhemfarm_commerce_test
      TEST_DATABASE_URL: postgresql://anhemfarm:ci-only-password@127.0.0.1:5432/anhemfarm_commerce_test
      SESSION_SECRET: ci-only-session-secret-32-chars-long
      EMAIL_PAYLOAD_KEY: ci-only-payload-key-32-chars-long!!
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_FROM: test@example.test
      STORAGE_LOCAL_DIR: server/uploads
      SALES_ENABLED: 'false'
      DEMO_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm --prefix server run db:migrate
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - run: npm --prefix server audit --audit-level=high
